//file:noinspection
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.jar_name}-fabric"
}

repositories {
	maven {
		name = 'Mod Menu'
		url = 'https://maven.terraformersmc.com/releases'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation("com.terraformersmc:modmenu:${project.mod_menu_version}")
}

loom {
	accessWidenerPath = file("src/main/resources/${mod_id}.classtweaker")
}

processResources {
	def expandProps = [
		"java_version_range": java_version_range,
		"minecraft_version": minecraft_version,
		"minecraft_version_range": minecraft_version_range,
		"fabric_loader_version": fabric_loader_version,
		"fabric_loader_version_range": fabric_loader_version_range,
		"fabric_version": fabric_version,
		"mod_id": mod_id,
		"mod_name": mod_name,
		"mod_author": mod_author,
		"mod_version": mod_version,
		"mod_icon": mod_icon,
		"mod_license": mod_license,
		"mod_description": mod_description,
		"mod_repo": mod_repo,
	]

	filesMatching(['fabric.mod.json', '*.mixins.json']) {
		expand expandProps
	}
	inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
