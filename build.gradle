//file:noinspection SpellCheckingInspection
//file:noinspection GroovyAssignabilityCheck
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.23,8.0)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${jar_name}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
    
    runs {
        configureEach {
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            args "--mixin.config=${mod_id}.mixins.json"
        }

        register('client') {
            workingDir = layout.projectDirectory.dir('run/client')
        }

        register('server') {
            workingDir = layout.projectDirectory.dir('run/server')
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
//    gradlePluginPortal()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, 
            minecraft_version_range: minecraft_version_range,
            forge_loader_version_range: forge_loader_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            mod_id: mod_id, 
            mod_name: mod_name, 
            mod_author: mod_author, 
            mod_version: mod_version,
            mod_icon: mod_icon,
            mod_license: mod_license, 
            mod_description: mod_description,
            mod_repo: mod_repo,
            project_version: project.version,
            project_group: project.group
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', '*.mixins.json']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_author,
            'Specification-Version'   : '1', // We are version 1 of ourselves
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_author,
            'MixinConfigs': "${mod_id}.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
